services:
  - type: web
    name: Sara Power-trading-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_ADMIN_IDS
        value: "5581361893"
      - key: SUPABASE_URL
        value: "https://krkefcpvcmhqiuixgnyd.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENVIRONMENT
        value: "production"
